<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" width="100%" height="480" style="background-color: #0d1117; border-radius: 10px;" role="img" aria-label="Roshan Gautam Profile Card">
  <defs>
    <style>
      .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
      .accent-head { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10px; font-weight: 700; fill: #7ee787; letter-spacing: 1.2px; }
      .term-cmd { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; fill: #8b949e; font-weight: 600; }
      .term-user { fill: #7ee787; }
      .cursor {
        animation: cursorBlink 1s infinite steps(1);
        fill: #7ee787;
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes sectionSlideIn {
        0% {
          opacity: 0;
          transform: translateY(8px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .anim-highlights {
        animation: sectionSlideIn 0.5s ease-out 0.20s forwards;
        opacity: 0;
      }
      .anim-stack {
        animation: sectionSlideIn 0.5s ease-out 0.60s forwards;
        opacity: 0;
      }
      .anim-projects {
        animation: sectionSlideIn 0.5s ease-out 1.00s forwards;
        opacity: 0;
      }
      .anim-footer {
        animation: sectionSlideIn 0.5s ease-out 1.40s forwards;
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .anim-highlights, .anim-stack, .anim-projects, .anim-footer {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
        .cursor {
          animation: none !important;
          opacity: 1 !important;
        }
      }
      .bullet-marker { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10.5px; font-weight: 700; fill: #7ee787; }
      .bullet-strong { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 9.5px; font-weight: 700; fill: #f0f6fc; }
      .bullet-text { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 9px; fill: #c9d1d9; }
      .cat-label { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 8.5px; font-weight: 700; fill: #8b949e; letter-spacing: 0.8px; }
      .tag-text { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 8.5px; fill: #c9d1d9; }
      .proj-title { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; font-weight: 700; fill: #f0f6fc; }
      .proj-link { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 9px; fill: #7ee787; font-weight: 500; }
      .proj-desc { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 9px; fill: #c9d1d9; }
      .proj-tech { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 8.5px; fill: #8b949e; }
      .status-text { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 9px; fill: #484f58; }
    </style>
  </defs>

  <!-- Card Background & 1px Border -->
  <rect x="0.5" y="0.5" width="459" height="479" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Faux Terminal Title Bar -->
  <path d="M 0.5 10.5 A 10 10 0 0 1 10.5 0.5 L 449.5 0.5 A 10 10 0 0 1 459.5 10.5 L 459.5 32.5 L 0.5 32.5 Z" fill="#161b22" />
  <line x1="0.5" y1="32.5" x2="459.5" y2="32.5" stroke="#30363d" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="20" cy="16.5" r="4.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="34" cy="16.5" r="4.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="48" cy="16.5" r="4.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Terminal Command with Blinking Cursor -->
  <text x="66" y="20.5" class="term-cmd">
    <tspan class="term-user">roshan</tspan><tspan fill="#484f58">@</tspan><tspan fill="#f0f6fc">github</tspan><tspan fill="#484f58">:~$</tspan> <tspan fill="#f0f6fc">whoami</tspan><tspan class="cursor">_</tspan>
  </text>


  <!-- SECTION: HIGHLIGHTS (Top) -->
  <g id="section-highlights" class="anim-highlights">
    <text x="22" y="50" class="accent-head">// HIGHLIGHTS</text>

    <g>
      <text x="24" y="66" class="bullet-marker">&gt;</text>
      <text x="36" y="66" class="bullet-text">Digital Marketing: SEO-driven growth, content strategy</text>
      <text x="36" y="78" class="bullet-text">and campaigns that turn traffic into results.</text>
    </g>
    <g>
      <text x="24" y="96" class="bullet-marker">&gt;</text>
      <text x="36" y="96" class="bullet-text">Full Stack Web Apps: end-to-end products, from</text>
      <text x="36" y="108" class="bullet-text">FastAPI/Next.js backends to responsive, polished</text>
      <text x="36" y="120" class="bullet-text">frontends.</text>
    </g>
    <g>
      <text x="24" y="138" class="bullet-marker">&gt;</text>
      <text x="36" y="138" class="bullet-text">SEO: technical audits, on-page optimization and</text>
      <text x="36" y="150" class="bullet-text">WordPress builds that actually rank.</text>
    </g>
  </g>

  <!-- SECTION: STACK (Middle) -->
  <g id="section-stack" class="anim-stack">
    <text x="22" y="172" class="accent-head">// TECH STACK</text>

    <!-- CORE -->
    <g>
      <rect x="22" y="177" width="62" height="15" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="26" y="188" class="cat-label">CORE</text>
    </g>
    <g>
      <rect x="89" y="177" width="61.0" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="94" y="188" class="tag-text">TypeScript</text>
    </g>
    <g>
      <rect x="154.0" y="177" width="40.6" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="159.0" y="188" class="tag-text">Python</text>
    </g>
    <g>
      <rect x="198.6" y="177" width="20.2" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="203.6" y="188" class="tag-text">Go</text>
    </g>
    <g>
      <rect x="222.79999999999998" y="177" width="25.3" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="227.79999999999998" y="188" class="tag-text">SQL</text>
    </g>
    <!-- FRONTEND -->
    <g>
      <rect x="22" y="196" width="62" height="15" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="26" y="207" class="cat-label">FRONTEND</text>
    </g>
    <g>
      <rect x="89" y="196" width="35.5" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="94" y="207" class="tag-text">React</text>
    </g>
    <g>
      <rect x="128.5" y="196" width="45.7" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="133.5" y="207" class="tag-text">Next.js</text>
    </g>
    <g>
      <rect x="178.2" y="196" width="66.1" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="183.2" y="207" class="tag-text">TailwindCSS</text>
    </g>
    <g>
      <rect x="248.29999999999998" y="196" width="61.0" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="253.29999999999998" y="207" class="tag-text">HTML5/CSS3</text>
    </g>
    <!-- BACKEND -->
    <g>
      <rect x="22" y="215" width="62" height="15" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="26" y="226" class="cat-label">BACKEND</text>
    </g>
    <g>
      <rect x="89" y="215" width="45.7" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="94" y="226" class="tag-text">Node.js</text>
    </g>
    <g>
      <rect x="138.7" y="215" width="45.7" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="143.7" y="226" class="tag-text">FastAPI</text>
    </g>
    <g>
      <rect x="188.39999999999998" y="215" width="61.0" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="193.39999999999998" y="226" class="tag-text">PostgreSQL</text>
    </g>
    <g>
      <rect x="253.39999999999998" y="215" width="35.5" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="258.4" y="226" class="tag-text">Redis</text>
    </g>
    <!-- INFRA -->
    <g>
      <rect x="22" y="234" width="62" height="15" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="26" y="245" class="cat-label">INFRA</text>
    </g>
    <g>
      <rect x="89" y="234" width="40.6" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="94" y="245" class="tag-text">Docker</text>
    </g>
    <g>
      <rect x="133.6" y="234" width="35.5" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="138.6" y="245" class="tag-text">Linux</text>
    </g>
    <g>
      <rect x="173.1" y="234" width="81.4" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="178.1" y="245" class="tag-text">GitHub Actions</text>
    </g>
    <g>
      <rect x="258.5" y="234" width="25.3" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="263.5" y="245" class="tag-text">AWS</text>
    </g>
  </g>

  <!-- SECTION: PROJECTS (Bottom) -->
  <g id="section-projects" class="anim-projects">
    <text x="22" y="272" class="accent-head">// FEATURED PROJECTS</text>

    <!-- Project: Markly AI -->
    <g>
      <circle cx="26" cy="284.5" r="2" fill="#7ee787"/>
      <text x="35" y="288" class="proj-title">Markly AI</text>

      <text x="438" y="288" class="proj-link" text-anchor="end">[repo ↗]  [live ↗]</text>
      <text x="35" y="301" class="proj-desc">TU exam answer generator with marks-based answer lengths.</text>
      <text x="35" y="313" class="proj-tech">⚡ FastAPI · PostgreSQL · Groq · JS</text>
    </g>
    <!-- Project: Gunaso -->
    <g>
      <circle cx="26" cy="324.5" r="2" fill="#7ee787"/>
      <text x="35" y="328" class="proj-title">Gunaso</text>

      <text x="438" y="328" class="proj-link" text-anchor="end">[live ↗]</text>
      <text x="35" y="341" class="proj-desc">Nepal citizen complaint portal with auto-escalation &amp; AI alerts.</text>
      <text x="35" y="353" class="proj-tech">⚡ Next.js · Mobile App · AI Inspection</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <g id="section-footer" class="anim-footer">
    <line x1="22" y1="456" x2="438" y2="456" stroke="#21262d" stroke-width="1"/>
    <circle cx="27" cy="468" r="3" fill="#7ee787"/>
    <text x="36" y="471" class="status-text">status: active &amp; shipping</text>
    <text x="438" y="471" class="status-text" text-anchor="end">sys: linux · term: zsh</text>
  </g>
</svg>
