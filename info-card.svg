    <text x="22" y="55" class="accent-head">// EXPERIENCE</text>

    <g>
      <circle cx="26" cy="71.5" r="2" fill="#7ee787"/>
      <text x="35" y="75" class="role-title">Lead Software Engineer <tspan class="company-text">@ Nexus Systems</tspan></text>
      <text x="438" y="75" class="years-text">2023 - Present</text>
    </g>
    <g>
      <circle cx="26" cy="91.5" r="2" fill="#7ee787"/>
      <text x="35" y="95" class="role-title">Full-Stack Developer <tspan class="company-text">@ VentureScale Labs</tspan></text>
      <text x="438" y="95" class="years-text">2021 - 2023</text>
    </g>
    <g>
      <circle cx="26" cy="111.5" r="2" fill="#7ee787"/>
      <text x="35" y="115" class="role-title">Frontend &amp; SEO Engineer <tspan class="company-text">@ GrowthCraft Studio</tspan></text>
      <text x="438" y="115" class="years-text">2019 - 2021</text>
    </g>
  </g>

