<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 460 480" width="100%" height="480"
     role="img" aria-label="Roshan Gautam Profile Card">
  <defs>
    <style>
      :root {
        --bg: #0d1117;
        --card-bg: #161b22;
        --border: #30363d;
        --pill-bg: #21262d;
        --text-pri: #f0f6fc;
        --text-sec: #8b949e;
        --text-mut: #6e7681;
        --accent1: #58a6ff;
        --accent2: #3fb950;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --card-bg: #f6f8fa;
          --border: #d0d7de;
          --pill-bg: #eaeef2;
          --text-pri: #1f2328;
          --text-sec: #57606a;
          --text-mut: #8c959f;
          --accent1: #0969da;
          --accent2: #1a7f37;
        }
      }
      .ah { font-family:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:10px; font-weight:700; fill:var(--accent1); letter-spacing:1.2px }
      .bm { font-family:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:10.5px; font-weight:700; fill:var(--accent2) }
      .bt { font-family:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:9px; fill:var(--text-pri) }
      .cl { font-family:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:8.5px; font-weight:700; fill:var(--text-sec); letter-spacing:.8px }
      .tt { font-family:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:8.5px; fill:var(--text-pri) }
      .pt { font-family:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:10.5px; font-weight:700; fill:var(--text-pri) }
      .pl { font-family:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:8.5px; fill:var(--accent1); font-weight:500 }
      .pd { font-family:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:8.5px; fill:var(--text-sec) }
      .pk { font-family:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:8px; fill:var(--accent2) }
      .st { font-family:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:8.5px; fill:var(--text-mut) }
      .tc { font-family:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:11px; fill:var(--text-sec); font-weight:600 }
    </style>
  </defs>

  <!-- card background -->
  <rect x=".5" y=".5" width="459" height="479" rx="10"
        fill="var(--bg)" stroke="var(--border)" stroke-width="1"/>

  <!-- terminal title bar -->
  <path d="M.5 10.5A10 10 0 0 1 10.5.5L449.5.5A10 10 0 0 1 459.5 10.5V32.5H.5Z"
        fill="var(--card-bg)"/>
  <line x1=".5" y1="32.5" x2="459.5" y2="32.5" stroke="var(--border)" stroke-width="1"/>

  <!-- window dots -->
  <circle cx="20" cy="16.5" r="4.5" fill="#ff5f56" stroke="#e0443e" stroke-width=".5"/>
  <circle cx="34" cy="16.5" r="4.5" fill="#ffbd2e" stroke="#dea123" stroke-width=".5"/>
  <circle cx="48" cy="16.5" r="4.5" fill="#27c93f" stroke="#1aab29" stroke-width=".5"/>

  <!-- prompt static (no animation) -->
  <text x="66" y="20.5" class="tc">
    <tspan fill="var(--accent1)">roshan</tspan><tspan fill="var(--text-mut)">@</tspan><tspan fill="var(--text-pri)">github</tspan><tspan fill="var(--text-mut)">:~$</tspan>
    <tspan fill="var(--text-pri)"> whoami</tspan><tspan fill="var(--accent1)">_</tspan>
  </text>

  <g id="highlights">
    <text x="22" y="50" class="ah">// FOCUS AREAS</text>
    <text x="24" y="64" class="bm">&gt;</text>
    <text x="36" y="64.0" class="bt">SEO: technical audits, on-page optimization &amp; site</text>
    <text x="36" y="75.5" class="bt">architecture that rank.</text>
    <text x="24" y="91.0" class="bm">&gt;</text>
    <text x="36" y="91.0" class="bt">Full Stack Web Apps: production apps with FastAPI,</text>
    <text x="36" y="102.5" class="bt">Next.js &amp; PostgreSQL.</text>
    <text x="24" y="118.0" class="bm">&gt;</text>
    <text x="36" y="118.0" class="bt">Digital Marketing: search &amp; content growth strategies</text>
    <text x="36" y="129.5" class="bt">that drive leads.</text>
  </g>
  <g id="stack">
    <text x="22" y="149.0" class="ah">// TECH &amp; TOOLS</text>
    <rect x="22" y="153.0" width="72" height="14" rx="3" fill="var(--card-bg)" stroke="var(--border)" stroke-width=".8"/>
    <text x="26" y="163.0" class="cl">DEV</text>
    <rect x="99" y="153.0" width="58.0" height="14" rx="3" fill="var(--pill-bg)" stroke="var(--border)" stroke-width=".8"/>
    <text x="104" y="163.0" class="tt">TypeScript</text>
    <rect x="161.0" y="153.0" width="38.8" height="14" rx="3" fill="var(--pill-bg)" stroke="var(--border)" stroke-width=".8"/>
    <text x="166.0" y="163.0" class="tt">Python</text>
    <rect x="203.8" y="153.0" width="43.6" height="14" rx="3" fill="var(--pill-bg)" stroke="var(--border)" stroke-width=".8"/>
    <text x="208.8" y="163.0" class="tt">Next.js</text>
    <rect x="251.4" y="153.0" width="43.6" height="14" rx="3" fill="var(--pill-bg)" stroke="var(--border)" stroke-width=".8"/>
    <text x="256.4" y="163.0" class="tt">FastAPI</text>
    <rect x="299.0" y="153.0" width="58.0" height="14" rx="3" fill="var(--pill-bg)" stroke="var(--border)" stroke-width=".8"/>
    <text x="304.0" y="163.0" class="tt">PostgreSQL</text>
    <rect x="361.0" y="153.0" width="38.8" height="14" rx="3" fill="var(--pill-bg)" stroke="var(--border)" stroke-width=".8"/>
    <text x="366.0" y="163.0" class="tt">Docker</text>
    <rect x="22" y="171.0" width="72" height="14" rx="3" fill="var(--card-bg)" stroke="var(--border)" stroke-width=".8"/>
    <text x="26" y="181.0" class="cl">SEO &amp; TOOLS</text>
    <rect x="99" y="171.0" width="77.2" height="14" rx="3" fill="var(--pill-bg)" stroke="var(--border)" stroke-width=".8"/>
    <text x="104" y="181.0" class="tt">Search Console</text>
    <rect x="180.2" y="171.0" width="24.4" height="14" rx="3" fill="var(--pill-bg)" stroke="var(--border)" stroke-width=".8"/>
    <text x="185.2" y="181.0" class="tt">GA4</text>
    <rect x="208.6" y="171.0" width="77.2" height="14" rx="3" fill="var(--pill-bg)" stroke="var(--border)" stroke-width=".8"/>
    <text x="213.6" y="181.0" class="tt">Screaming Frog</text>
    <rect x="289.8" y="171.0" width="38.8" height="14" rx="3" fill="var(--pill-bg)" stroke="var(--border)" stroke-width=".8"/>
    <text x="294.8" y="181.0" class="tt">Ahrefs</text>
    <rect x="332.6" y="171.0" width="43.6" height="14" rx="3" fill="var(--pill-bg)" stroke="var(--border)" stroke-width=".8"/>
    <text x="337.6" y="181.0" class="tt">SEMrush</text>
  </g>
  <g id="projects">
    <text x="22" y="205.0" class="ah">// FEATURED WORK</text>
    <circle cx="26" cy="215.5" r="2" fill="var(--accent1)"/>
    <text x="35" y="219.0" class="pt">Markly AI</text>
    <text x="438" y="219.0" class="pl" text-anchor="end">[repo ↗]  [live ↗]</text>
    <text x="35" y="230.0" class="pd">TU exam answer generator with marks-based answer lengths.</text>
    <text x="35" y="240.0" class="pk">⚡ FastAPI · PostgreSQL · Groq</text>
    <circle cx="26" cy="248.5" r="2" fill="var(--accent1)"/>
    <text x="35" y="252.0" class="pt">Gunaso</text>
    <text x="438" y="252.0" class="pl" text-anchor="end">[repo ↗]  [live ↗]</text>
    <text x="35" y="263.0" class="pd">Citizen complaint portal with auto-escalation &amp; AI inspection.</text>
    <text x="35" y="273.0" class="pk">⚡ Next.js · Supabase · PWA</text>
    <circle cx="26" cy="281.5" r="2" fill="var(--accent1)"/>
    <text x="35" y="285.0" class="pt">SEO Case Studies</text>
    <text x="438" y="285.0" class="pl" text-anchor="end">[repo ↗]</text>
    <text x="35" y="296.0" class="pd">Technical audits, on-page SEO frameworks &amp; organic growth blueprints.</text>
    <text x="35" y="306.0" class="pk">⚡ Technical SEO · Schema · GSC</text>
  </g>
  <g id="footer">
    <line x1="22" y1="458" x2="438" y2="458" stroke="var(--border)" stroke-width="1"/>
    <circle cx="27" cy="469" r="3" fill="var(--accent2)"/>
    <text x="36" y="472" class="st">status: open for full stack &amp; SEO roles</text>
    <text x="438" y="472" class="st" text-anchor="end">Kathmandu, Nepal</text>
  </g>
</svg>