    </g>
    <g>
      <text x="24" y="348" class="bullet-marker">&gt;</text>
      <text x="36" y="348" class="bullet-text">Exploring agentic AI systems, distributed caching, and ...</text>
    </g>
  </g>

  <!-- Footer Status Bar -->
  <line x1="22" y1="452" x2="438" y2="452" stroke="#21262d" stroke-width="1"/>
  <circle cx="27" cy="466" r="3" fill="#7ee787"/>
  <text x="36" y="469" class="status-text">status: active &amp; shipping</text>
  <text x="438" y="469" class="status-text" text-anchor="end">sys: linux · term: zsh<tspan fill="#7ee787">_</tspan></text>
