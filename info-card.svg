<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" width="100%" height="480" style="background-color: #0d1117; border-radius: 10px;" role="img" aria-label="Roshan Gautam Profile Card">
  <defs>
    <style>
      .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
      .accent-head { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10px; font-weight: 700; fill: #7ee787; letter-spacing: 1.2px; }
      .term-cmd { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; fill: #8b949e; font-weight: 600; }
      .term-user { fill: #7ee787; }
      .cursor {
        animation: cursorBlink 1s infinite steps(1);
        fill: #7ee787;
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes sectionSlideIn {
        0% {
          opacity: 0;
          transform: translateY(10px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .anim-stack {
        animation: sectionSlideIn 0.6s ease-out 0.25s forwards;
        opacity: 0;
      }
      .anim-projects {
        animation: sectionSlideIn 0.6s ease-out 0.65s forwards;
        opacity: 0;
      }
      .anim-highlights {
        animation: sectionSlideIn 0.6s ease-out 1.05s forwards;
        opacity: 0;
      }
      .anim-footer {
        animation: sectionSlideIn 0.6s ease-out 1.45s forwards;
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .anim-stack, .anim-projects, .anim-highlights, .anim-footer {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
        .cursor {
          animation: none !important;
          opacity: 1 !important;
        }
      }
      .cat-label { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 9px; font-weight: 700; fill: #8b949e; letter-spacing: 0.8px; }
      .tag-text { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 9px; fill: #c9d1d9; }
      .proj-title { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11.5px; font-weight: 700; fill: #f0f6fc; }
      .proj-link { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 9.5px; fill: #7ee787; font-weight: 500; }
      .proj-desc { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 9.5px; fill: #c9d1d9; }
      .proj-tech { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 8.5px; fill: #8b949e; }
      .bullet-marker { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; font-weight: 700; fill: #7ee787; }
      .bullet-text { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 9.5px; fill: #c9d1d9; }
      .status-text { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 9px; fill: #484f58; }
    </style>
  </defs>

  <!-- Card Background & 1px Border -->
  <rect x="0.5" y="0.5" width="459" height="479" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Faux Terminal Title Bar -->
  <path d="M 0.5 10.5 A 10 10 0 0 1 10.5 0.5 L 449.5 0.5 A 10 10 0 0 1 459.5 10.5 L 459.5 32.5 L 0.5 32.5 Z" fill="#161b22" />
  <line x1="0.5" y1="32.5" x2="459.5" y2="32.5" stroke="#30363d" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="20" cy="16.5" r="4.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="34" cy="16.5" r="4.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="48" cy="16.5" r="4.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Terminal Command with Blinking Cursor -->
  <text x="66" y="20.5" class="term-cmd">
    <tspan class="term-user">roshan</tspan><tspan fill="#484f58">@</tspan><tspan fill="#f0f6fc">github</tspan><tspan fill="#484f58">:~$</tspan> <tspan fill="#f0f6fc">whoami</tspan><tspan class="cursor">_</tspan>
  </text>


  <!-- SECTION: STACK (Animated) -->
  <g id="section-stack" class="anim-stack">
    <text x="22" y="50" class="accent-head">// TECH STACK</text>

    <!-- CORE -->
    <g>
      <rect x="22" y="56" width="64" height="16" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="26" y="68" class="cat-label">CORE</text>
    </g>
    <g>
      <rect x="91" y="56" width="64.0" height="16" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="96" y="68" class="tag-text">TypeScript</text>
    </g>
    <g>
      <rect x="159.0" y="56" width="42.4" height="16" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="164.0" y="68" class="tag-text">Python</text>
    </g>
    <g>
      <rect x="205.4" y="56" width="20.8" height="16" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="210.4" y="68" class="tag-text">Go</text>
    </g>
    <g>
      <rect x="230.20000000000002" y="56" width="26.2" height="16" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="235.20000000000002" y="68" class="tag-text">SQL</text>
    </g>
    <!-- FRONTEND -->
    <g>
      <rect x="22" y="77" width="64" height="16" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="26" y="89" class="cat-label">FRONTEND</text>
    </g>
    <g>
      <rect x="91" y="77" width="37.0" height="16" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="96" y="89" class="tag-text">React</text>
    </g>
    <g>
      <rect x="132.0" y="77" width="47.8" height="16" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="137.0" y="89" class="tag-text">Next.js</text>
    </g>
    <g>
      <rect x="183.8" y="77" width="69.4" height="16" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="188.8" y="89" class="tag-text">TailwindCSS</text>
    </g>
    <g>
      <rect x="257.20000000000005" y="77" width="64.0" height="16" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="262.20000000000005" y="89" class="tag-text">HTML5/CSS3</text>
    </g>
    <!-- BACKEND -->
    <g>
      <rect x="22" y="98" width="64" height="16" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="26" y="110" class="cat-label">BACKEND</text>
    </g>
    <g>
      <rect x="91" y="98" width="47.8" height="16" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="96" y="110" class="tag-text">Node.js</text>
    </g>
    <g>
      <rect x="142.8" y="98" width="47.8" height="16" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="147.8" y="110" class="tag-text">FastAPI</text>
    </g>
    <g>
      <rect x="194.60000000000002" y="98" width="64.0" height="16" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="199.60000000000002" y="110" class="tag-text">PostgreSQL</text>
    </g>
    <g>
      <rect x="262.6" y="98" width="37.0" height="16" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="267.6" y="110" class="tag-text">Redis</text>
    </g>
    <!-- INFRA -->
    <g>
      <rect x="22" y="119" width="64" height="16" rx="3" fill="#161b22" stroke="#30363d" stroke-width="0.8"/>
      <text x="26" y="131" class="cat-label">INFRA</text>
    </g>
    <g>
      <rect x="91" y="119" width="42.4" height="16" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="96" y="131" class="tag-text">Docker</text>
    </g>
    <g>
      <rect x="137.4" y="119" width="37.0" height="16" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="142.4" y="131" class="tag-text">Linux</text>
    </g>
    <g>
      <rect x="178.4" y="119" width="85.6" height="16" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="183.4" y="131" class="tag-text">GitHub Actions</text>
    </g>
    <g>
      <rect x="268.0" y="119" width="26.2" height="16" rx="3" fill="#21262d" stroke="#30363d" stroke-width="0.8"/>
      <text x="273.0" y="131" class="tag-text">AWS</text>
    </g>
  </g>

  <!-- SECTION: PROJECTS (Animated) -->
  <g id="section-projects" class="anim-projects">
    <text x="22" y="162" class="accent-head">// FEATURED PROJECTS</text>

    <!-- Project: Markly AI -->
    <g>
      <circle cx="26" cy="176.5" r="2" fill="#7ee787"/>
      <text x="35" y="180" class="proj-title">Markly AI</text>

      <text x="438" y="180" class="proj-link" text-anchor="end">[repo ↗]  [live ↗]</text>
      <text x="35" y="194" class="proj-desc">TU exam answer generator with marks-based answer lengths.</text>
      <text x="35" y="207" class="proj-tech">⚡ FastAPI · PostgreSQL · Groq · JS</text>
    </g>
    <!-- Project: Gunaso -->
    <g>
      <circle cx="26" cy="220.5" r="2" fill="#7ee787"/>
      <text x="35" y="224" class="proj-title">Gunaso</text>

      <text x="438" y="224" class="proj-link" text-anchor="end">[live ↗]</text>
      <text x="35" y="238" class="proj-desc">Nepal citizen complaint portal with auto-escalation &amp; AI alerts.</text>
      <text x="35" y="251" class="proj-tech">⚡ Next.js · Mobile App · AI Inspection</text>
    </g>
  </g>

  <!-- SECTION: HIGHLIGHTS (Animated) -->
  <g id="section-highlights" class="anim-highlights">
    <text x="22" y="272" class="accent-head">// HIGHLIGHTS</text>

    <g>
      <text x="24" y="290" class="bullet-marker">&gt;</text>
      <text x="36" y="290" class="bullet-text">Spearheaded technical SEO revamp boosting organic impressio...</text>
    </g>
    <g>
      <text x="24" y="308" class="bullet-marker">&gt;</text>
      <text x="36" y="308" class="bullet-text">Architected high-throughput microservices handling 10M+ dai...</text>
    </g>
    <g>
      <text x="24" y="326" class="bullet-marker">&gt;</text>
      <text x="36" y="326" class="bullet-text">Open-source builder exploring agentic AI workflows &amp; mo...</text>
    </g>
  </g>

  <!-- Footer Status Bar (Animated) -->
  <g id="section-footer" class="anim-footer">
    <line x1="22" y1="454" x2="438" y2="454" stroke="#21262d" stroke-width="1"/>
    <circle cx="27" cy="467" r="3" fill="#7ee787"/>
    <text x="36" y="470" class="status-text">status: active &amp; shipping</text>
    <text x="438" y="470" class="status-text" text-anchor="end">sys: linux · term: zsh</text>
  </g>
</svg>
