<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 460 480" width="100%" height="480"
     style="background:#0d1117;border-radius:10px;"
     role="img" aria-label="Roshan Gautam Profile Card">
  <defs>
    <style>
      @keyframes blink {
        0%,49% { opacity:1 } 50%,100% { opacity:0 }
      }
      @keyframes slideIn {
        from { opacity:0; transform:translateY(9px) }
        to   { opacity:1; transform:translateY(0)   }
      }
      .cursor  { fill:#7ee787; animation:blink 1s steps(1) infinite }
      .s0 { opacity:0; animation:slideIn .5s ease-out .15s forwards }
      .s1 { opacity:0; animation:slideIn .5s ease-out .55s forwards }
      .s2 { opacity:0; animation:slideIn .5s ease-out .95s forwards }
      .s3 { opacity:0; animation:slideIn .5s ease-out 1.35s forwards }
      @media(prefers-reduced-motion:reduce){
        .s0,.s1,.s2,.s3{ animation:none!important; opacity:1!important }
        .cursor{ animation:none!important; opacity:1!important }
      }
      .ah  { font:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:10px; font-weight:700; fill:#7ee787; letter-spacing:1.2px }
      .bm  { font:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:10.5px; font-weight:700; fill:#7ee787 }
      .bt  { font:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:9px; fill:#c9d1d9 }
      .cl  { font:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:8.5px; font-weight:700; fill:#8b949e; letter-spacing:.8px }
      .tt  { font:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:8.5px; fill:#c9d1d9 }
      .pt  { font:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:11px; font-weight:700; fill:#f0f6fc }
      .pl  { font:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:9px; fill:#7ee787; font-weight:500 }
      .pd  { font:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:9px; fill:#c9d1d9 }
      .pk  { font:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:8.5px; fill:#8b949e }
      .st  { font:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:9px; fill:#484f58 }
      .tc  { font:SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size:11px; fill:#8b949e; font-weight:600 }
    </style>
  </defs>

  <!-- card background -->
  <rect x=".5" y=".5" width="459" height="479" rx="10"
        fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- terminal title bar -->
  <path d="M.5 10.5A10 10 0 0 1 10.5.5L449.5.5A10 10 0 0 1 459.5 10.5V32.5H.5Z"
        fill="#161b22"/>
  <line x1=".5" y1="32.5" x2="459.5" y2="32.5" stroke="#30363d" stroke-width="1"/>

  <!-- window dots -->
  <circle cx="20" cy="16.5" r="4.5" fill="#ff5f56" stroke="#e0443e" stroke-width=".5"/>
  <circle cx="34" cy="16.5" r="4.5" fill="#ffbd2e" stroke="#dea123" stroke-width=".5"/>
  <circle cx="48" cy="16.5" r="4.5" fill="#27c93f" stroke="#1aab29" stroke-width=".5"/>

  <!-- prompt + blinking cursor -->
  <text x="66" y="20.5" class="tc">
    <tspan fill="#7ee787">leo</tspan><tspan fill="#484f58">@</tspan><tspan fill="#f0f6fc">github</tspan><tspan fill="#484f58">:~$</tspan>
    <tspan fill="#f0f6fc"> whoami</tspan><tspan class="cursor">_</tspan>
  </text>

  <g class="s0">
    <text x="22" y="50" class="ah">// HIGHLIGHTS</text>
    <text x="24" y="65" class="bm">&gt;</text>
    <text x="36" y="65" class="bt">Digital Marketing: SEO-driven growth, content</text>
    <text x="36" y="77" class="bt">strategy and campaigns that turn traffic into</text>
    <text x="36" y="89" class="bt">results.</text>
    <text x="24" y="106" class="bm">&gt;</text>
    <text x="36" y="106" class="bt">Full Stack Web Apps: end-to-end products, from</text>
    <text x="36" y="118" class="bt">FastAPI/Next.js backends to responsive, polished</text>
    <text x="36" y="130" class="bt">frontends.</text>
    <text x="24" y="147" class="bm">&gt;</text>
    <text x="36" y="147" class="bt">SEO: technical audits, on-page optimization and</text>
    <text x="36" y="159" class="bt">WordPress builds that actually rank.</text>
  </g>
  <g class="s1">
    <text x="22" y="180" class="ah">// TECH STACK</text>
    <rect x="22" y="184" width="62" height="15" rx="3" fill="#161b22" stroke="#30363d" stroke-width=".8"/>
    <text x="26" y="195" class="cl">CORE</text>
    <rect x="89" y="184" width="61.0" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width=".8"/>
    <text x="94" y="195" class="tt">TypeScript</text>
    <rect x="154.0" y="184" width="40.6" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width=".8"/>
    <text x="159.0" y="195" class="tt">Python</text>
    <rect x="198.6" y="184" width="20.2" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width=".8"/>
    <text x="203.6" y="195" class="tt">Go</text>
    <rect x="222.79999999999998" y="184" width="25.3" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width=".8"/>
    <text x="227.79999999999998" y="195" class="tt">SQL</text>
    <rect x="22" y="203" width="62" height="15" rx="3" fill="#161b22" stroke="#30363d" stroke-width=".8"/>
    <text x="26" y="214" class="cl">FRONTEND</text>
    <rect x="89" y="203" width="35.5" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width=".8"/>
    <text x="94" y="214" class="tt">React</text>
    <rect x="128.5" y="203" width="45.7" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width=".8"/>
    <text x="133.5" y="214" class="tt">Next.js</text>
    <rect x="178.2" y="203" width="66.1" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width=".8"/>
    <text x="183.2" y="214" class="tt">TailwindCSS</text>
    <rect x="248.29999999999998" y="203" width="61.0" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width=".8"/>
    <text x="253.29999999999998" y="214" class="tt">HTML5/CSS3</text>
    <rect x="22" y="222" width="62" height="15" rx="3" fill="#161b22" stroke="#30363d" stroke-width=".8"/>
    <text x="26" y="233" class="cl">BACKEND</text>
    <rect x="89" y="222" width="45.7" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width=".8"/>
    <text x="94" y="233" class="tt">Node.js</text>
    <rect x="138.7" y="222" width="45.7" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width=".8"/>
    <text x="143.7" y="233" class="tt">FastAPI</text>
    <rect x="188.39999999999998" y="222" width="61.0" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width=".8"/>
    <text x="193.39999999999998" y="233" class="tt">PostgreSQL</text>
    <rect x="253.39999999999998" y="222" width="35.5" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width=".8"/>
    <text x="258.4" y="233" class="tt">Redis</text>
    <rect x="22" y="241" width="62" height="15" rx="3" fill="#161b22" stroke="#30363d" stroke-width=".8"/>
    <text x="26" y="252" class="cl">INFRA</text>
    <rect x="89" y="241" width="40.6" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width=".8"/>
    <text x="94" y="252" class="tt">Docker</text>
    <rect x="133.6" y="241" width="35.5" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width=".8"/>
    <text x="138.6" y="252" class="tt">Linux</text>
    <rect x="173.1" y="241" width="81.4" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width=".8"/>
    <text x="178.1" y="252" class="tt">GitHub Actions</text>
    <rect x="258.5" y="241" width="25.3" height="15" rx="3" fill="#21262d" stroke="#30363d" stroke-width=".8"/>
    <text x="263.5" y="252" class="tt">AWS</text>
  </g>
  <g class="s2">
    <text x="22" y="277" class="ah">// FEATURED PROJECTS</text>
    <circle cx="26" cy="288.5" r="2" fill="#7ee787"/>
    <text x="35" y="292" class="pt">Markly AI</text>
    <text x="438" y="292" class="pl" text-anchor="end">[repo ↗]  [live ↗]</text>
    <text x="35" y="305" class="pd">TU exam answer generator with marks-based answer lengths.</text>
    <text x="35" y="317" class="pk">⚡ FastAPI · PostgreSQL · Groq · JS</text>
    <circle cx="26" cy="328.5" r="2" fill="#7ee787"/>
    <text x="35" y="332" class="pt">Gunaso</text>
    <text x="438" y="332" class="pl" text-anchor="end">[live ↗]</text>
    <text x="35" y="345" class="pd">Nepal citizen complaint portal with auto-escalation &amp; AI alerts.</text>
    <text x="35" y="357" class="pk">⚡ Next.js · Mobile App · AI Inspection</text>
  </g>
  <g class="s3">
    <line x1="22" y1="456" x2="438" y2="456" stroke="#21262d" stroke-width="1"/>
    <circle cx="27" cy="468" r="3" fill="#7ee787"/>
    <text x="36" y="471" class="st">status: active &amp; shipping</text>
    <text x="438" y="471" class="st" text-anchor="end">sys: linux · term: zsh</text>
  </g>
</svg>