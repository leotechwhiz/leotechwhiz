<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 480" width="100%" height="480" style="background-color: #0d1117; border-radius: 10px;" role="img" aria-label="Leo Profile Information Card">
  <defs>
    <style>
      .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
      .accent-head { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10px; font-weight: 700; fill: #7ee787; letter-spacing: 1.2px; }
      .role-title { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; font-weight: 600; fill: #f0f6fc; }
      .company-text { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10.5px; fill: #8b949e; }
      .years-text { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 9.5px; fill: #7ee787; font-weight: 500; text-anchor: end; }
      .cat-label { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 9px; font-weight: 700; fill: #8b949e; letter-spacing: 0.8px; }
      .tag-text { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 9.5px; fill: #c9d1d9; }
      .bullet-marker { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; font-weight: 700; fill: #7ee787; }
      .bullet-text { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 10px; fill: #c9d1d9; }
      .term-cmd { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11px; fill: #8b949e; font-weight: 600; }
      .term-user { fill: #7ee787; }
      .status-text { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 9.5px; fill: #484f58; }
    </style>
  </defs>

  <!-- Card Background & 1px Border -->
  <rect x="0.5" y="0.5" width="459" height="479" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Faux Terminal Title Bar -->
  <path d="M 0.5 10.5 A 10 10 0 0 1 10.5 0.5 L 449.5 0.5 A 10 10 0 0 1 459.5 10.5 L 459.5 32.5 L 0.5 32.5 Z" fill="#161b22" />
  <line x1="0.5" y1="32.5" x2="459.5" y2="32.5" stroke="#30363d" stroke-width="1"/>

  <!-- Terminal Window Dots -->
  <circle cx="20" cy="16.5" r="4.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="34" cy="16.5" r="4.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="48" cy="16.5" r="4.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Terminal Command -->
  <text x="66" y="20.5" class="term-cmd">
    <tspan class="term-user">leo</tspan><tspan fill="#484f58">@</tspan><tspan fill="#f0f6fc">github</tspan><tspan fill="#484f58">:~$</tspan> <tspan fill="#f0f6fc">whoami</tspan>
  </text>


  <!-- SECTION: EXPERIENCE -->
